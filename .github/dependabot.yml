# Dependabot: one grouped PR per ecosystem per week, minor and patch only.
# Major versions are ignored here and upgraded deliberately, one at a time.
# Ported from Syrtis (Nanako0129/TokenBar-Native).
#
# Not covered: the Sparkle package. The Xcode project has no root Package.swift,
# so Dependabot's swift ecosystem has nothing to read; Sparkle is upgraded by
# hand (see CLAUDE.md, Releasing).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
