name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check schema in sync
        run: bash scripts/check-schema-in-sync.sh

      - name: Build (Debug)
        run: |
          # Keep a green build's output short, but never swallow a red one's
          # diagnostics: print the error lines and the log tail on failure.
          set -o pipefail
          rc=0
          xcodebuild -project limpet.xcodeproj \
            -scheme limpet \
            -destination 'platform=macOS' \
            -configuration Debug \
            build \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || rc=$?

          if [ "$rc" -ne 0 ]; then
            echo "::group::Compiler diagnostics"
            grep -E '(error|warning): ' "$RUNNER_TEMP/xcodebuild.log" | head -200 || true
            echo "::endgroup::"
            echo "::group::Build log tail"
            tail -80 "$RUNNER_TEMP/xcodebuild.log"
            echo "::endgroup::"
            exit "$rc"
          fi

          tail -30 "$RUNNER_TEMP/xcodebuild.log"

      # limpet has no XCTest target; the `#if DEBUG` ConfigSelfTest suite
      # (`limpet --self-test`) is the test suite.
      - name: Self-test
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug/limpet.app/Contents/MacOS/limpet"
          if [ ! -x "$APP" ]; then
            echo "Debug binary not found at $APP — the build layout changed."
            exit 1
          fi
          "$APP" --self-test
